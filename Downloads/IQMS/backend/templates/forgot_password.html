{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 bg-gray-50 dark:bg-gray-950">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl mb-4 shadow-lg">
        <i data-lucide="key-round" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Mot de passe oublié</h1>
      <p class="text-gray-400 text-sm mt-1">Entrez votre email pour recevoir un lien de réinitialisation</p>
    </div>

    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-8 shadow-xl"
         x-data="forgotForm()">

      <div x-show="msg" x-cloak
           :class="ok ? 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 text-emerald-600' :
                        'bg-red-50 dark:bg-red-900/20 border-red-200 text-red-600'"
           class="flex items-start gap-2 border rounded-lg px-4 py-3 mb-4 text-sm">
        <i :data-lucide="ok ? 'check-circle' : 'alert-circle'" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
        <div>
          <span x-text="msg"></span>
          <div x-show="resetToken" x-cloak class="mt-2 p-2 bg-gray-100 dark:bg-gray-700 rounded font-mono text-xs break-all text-gray-700 dark:text-gray-200">
            Token : <span x-text="resetToken"></span>
            <br>
            <a :href="'/reset-password?token=' + resetToken"
               class="text-cyan-500 hover:underline">→ Cliquer ici pour réinitialiser</a>
          </div>
        </div>
      </div>

      <form @submit.prevent="submit" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Adresse email</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
            <input type="email" x-model="email" placeholder="votre@email.com" required
                   class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600
                          rounded-lg pl-10 pr-4 py-2.5 text-gray-900 dark:text-white
                          placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent text-sm"/>
          </div>
        </div>

        <button type="submit" :disabled="loading"
                class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500
                       text-white font-semibold py-2.5 rounded-lg transition-all duration-200 text-sm
                       disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-cyan-500/20">
          <span x-show="!loading">Envoyer le lien</span>
          <span x-show="loading" x-cloak class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Envoi...
          </span>
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="/login" class="text-sm text-cyan-500 hover:text-cyan-400 transition-colors">← Retour à la connexion</a>
      </div>
    </div>
  </div>
</div>

<script>
function forgotForm() {
  return {
    email: '', loading: false, msg: '', ok: false, resetToken: '',
    async submit() {
      this.loading = true; this.msg = ''; this.resetToken = '';
      try {
        const res = await fetch('/api/v1/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.email }),
        });
        const d = await res.json();
        this.ok = res.ok;
        this.msg = d.message || d.detail;
        if (d.reset_token) this.resetToken = d.reset_token;
      } catch(e) { this.ok = false; this.msg = 'Erreur réseau'; }
      finally { this.loading = false; this.$nextTick(() => lucide.createIcons()); }
    }
  };
}
</script>
{% endblock %}
