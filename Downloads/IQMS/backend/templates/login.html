{% extends "base.html" %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden
            bg-gradient-to-br from-slate-950 via-slate-900 to-teal-950">

  <!-- ── Arrière-plan animé ──────────────────────────────────── -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <!-- Blobs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full
                bg-teal-500/10 blur-3xl animate-float"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 rounded-full
                bg-sky-500/10 blur-3xl"
         style="animation: float 4s ease-in-out 1s infinite"></div>
    <div class="absolute top-1/2 left-1/4 w-64 h-64 rounded-full
                bg-indigo-500/5 blur-2xl"
         style="animation: float 5s ease-in-out .5s infinite"></div>
    <!-- Grid overlay -->
    <div class="absolute inset-0 opacity-[0.03]"
         style="background-image: linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),
                                  linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
                background-size: 40px 40px;"></div>
  </div>

  <!-- ── Carte de connexion ─────────────────────────────────── -->
  <div class="w-full max-w-[380px] relative z-10 animate-slide-up">

    <!-- Branding -->
    <div class="text-center mb-8">
      <div class="inline-flex flex-col items-center gap-3">
        <div class="relative">
          <div class="absolute inset-0 gradient-brand rounded-2xl blur-lg opacity-60 scale-110"></div>
          <div class="relative w-16 h-16 gradient-brand rounded-2xl flex items-center justify-center shadow-2xl">
            <i data-lucide="wind" class="w-8 h-8 text-white drop-shadow"></i>
          </div>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">AQIMS</h1>
          <p class="text-sm text-slate-400 mt-0.5 font-medium">Air Quality Index Monitoring</p>
        </div>
      </div>
    </div>

    <!-- Card -->
    <div class="relative rounded-2xl overflow-hidden"
         style="background: rgba(15,23,42,.8); backdrop-filter:blur(20px);
                border: 1px solid rgba(255,255,255,.07);
                box-shadow: 0 32px 64px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05)"
         x-data="loginForm()">

      <!-- Accent bar -->
      <div class="h-0.5 gradient-brand-animated"></div>

      <div class="p-8">
        <h2 class="text-lg font-semibold text-white mb-6 tracking-tight"
            x-text="step==='totp' ? 'Vérification à 2 facteurs' : 'Bienvenue'"></h2>

        <!-- Erreur -->
        <div x-show="error" x-cloak x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0"
             class="flex items-start gap-2.5 bg-red-500/10 border border-red-500/20 rounded-xl
                    px-4 py-3 mb-5 text-red-400 text-sm">
          <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
          <span x-text="error"></span>
        </div>

        <!-- ── Étape 1 : identifiants ── -->
        <form x-show="step==='credentials'" @submit.prevent="submit" class="space-y-4">

          <!-- Username -->
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
              Nom d'utilisateur
            </label>
            <div class="relative">
              <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
              <input type="text" x-model="username" placeholder="admin" autocomplete="username" required
                class="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl
                       pl-10 pr-4 py-3 text-white placeholder-slate-500 text-sm
                       transition-all duration-200 hover:border-slate-600
                       focus:border-teal-500/50 focus:bg-slate-800"/>
            </div>
          </div>

          <!-- Password -->
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
              Mot de passe
            </label>
            <div class="relative">
              <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
              <input :type="showPassword ? 'text' : 'password'" x-model="password"
                placeholder="••••••••" autocomplete="current-password" required
                class="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl
                       pl-10 pr-11 py-3 text-white placeholder-slate-500 text-sm
                       transition-all duration-200 hover:border-slate-600
                       focus:border-teal-500/50 focus:bg-slate-800"/>
              <button type="button" @click="showPassword = !showPassword"
                      class="absolute right-3.5 top-1/2 -translate-y-1/2 p-0.5
                             text-slate-500 hover:text-slate-300 transition-colors">
                <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="flex justify-end">
            <a href="/forgot-password"
               class="text-xs text-teal-400 hover:text-teal-300 font-medium transition-colors">
              Mot de passe oublié ?
            </a>
          </div>

          <!-- Submit -->
          <button type="submit" :disabled="loading"
            class="relative w-full gradient-brand hover:opacity-90 text-white font-semibold
                   py-3 rounded-xl transition-all duration-200 text-sm mt-1
                   disabled:opacity-50 disabled:cursor-not-allowed
                   shadow-lg shadow-teal-500/20 overflow-hidden group">
            <span class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></span>
            <span x-show="!loading" class="relative flex items-center justify-center gap-2">
              <i data-lucide="log-in" class="w-4 h-4"></i>
              Se connecter
            </span>
            <span x-show="loading" x-cloak class="flex items-center justify-center gap-2">
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
              </svg>
              Connexion en cours...
            </span>
          </button>
        </form>

        <!-- ── Étape 2 : TOTP ── -->
        <form x-show="step==='totp'" x-cloak @submit.prevent="submitTotp" class="space-y-4">
          <div class="flex items-center gap-3 p-3.5 bg-teal-500/10 border border-teal-500/20 rounded-xl mb-2">
            <i data-lucide="shield-check" class="w-5 h-5 text-teal-400 flex-shrink-0"></i>
            <p class="text-sm text-slate-300 leading-snug">
              Entrez le code à 6 chiffres de votre application d'authentification.
            </p>
          </div>

          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Code TOTP</label>
            <div class="relative">
              <i data-lucide="key-round" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
              <input type="text" x-model="totpCode" placeholder="123 456" maxlength="6" inputmode="numeric"
                autofocus required
                class="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl
                       pl-10 pr-4 py-3 text-white placeholder-slate-500 text-center
                       font-mono text-xl tracking-[0.5em]
                       transition-all duration-200 focus:border-teal-500/50 focus:bg-slate-800"/>
            </div>
          </div>

          <button type="submit" :disabled="loading"
            class="relative w-full gradient-brand hover:opacity-90 text-white font-semibold
                   py-3 rounded-xl transition-all duration-200 text-sm
                   disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-teal-500/20">
            <span x-show="!loading" class="flex items-center justify-center gap-2">
              <i data-lucide="shield" class="w-4 h-4"></i>
              Valider le code
            </span>
            <span x-show="loading" x-cloak class="flex items-center justify-center gap-2">
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
              </svg>
              Vérification...
            </span>
          </button>

          <button type="button" @click="step='credentials'; totpCode=''; error=''"
                  class="w-full text-xs text-slate-500 hover:text-slate-300 transition-colors py-1
                         flex items-center justify-center gap-1.5">
            <i data-lucide="arrow-left" class="w-3 h-3"></i>
            Retour à la connexion
          </button>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-slate-600 text-xs mt-6 font-medium">
      AQIMS v1.0 — Accès réservé aux personnes autorisées
    </p>
  </div>
</div>

<script>
  function loginForm() {
    return {
      step: 'credentials',
      username: '', password: '', showPassword: false,
      loading: false, error: '',
      tmpToken: '', totpCode: '',

      async submit() {
        this.loading = true; this.error = '';
        try {
          const fd = new FormData();
          fd.append('username', this.username);
          fd.append('password', this.password);
          const res  = await fetch('/api/v1/auth/login', { method: 'POST', body: fd });
          const data = await res.json();
          if (res.ok) {
            if (data.requires_2fa) {
              this.tmpToken = data.tmp_token;
              this.step = 'totp';
              this.$nextTick(() => lucide.createIcons());
            } else {
              window.location.href = '/dashboard';
            }
          } else {
            this.error = data.detail || 'Identifiants incorrects';
          }
        } catch (e) { this.error = 'Erreur réseau — réessayez'; }
        finally { this.loading = false; }
      },

      async submitTotp() {
        this.loading = true; this.error = '';
        try {
          const res = await fetch('/api/v1/auth/2fa/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tmp_token: this.tmpToken, code: this.totpCode }),
          });
          if (res.ok) {
            window.location.href = '/dashboard';
          } else {
            const d = await res.json();
            this.error = d.detail || 'Code TOTP invalide';
          }
        } catch (e) { this.error = 'Erreur réseau — réessayez'; }
        finally { this.loading = false; }
      }
    }
  }
</script>
{% endblock %}
