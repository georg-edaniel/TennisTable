{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 bg-gray-50 dark:bg-gray-950">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl mb-4 shadow-lg">
        <i data-lucide="lock-keyhole" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Nouveau mot de passe</h1>
      <p class="text-gray-400 text-sm mt-1">Choisissez un nouveau mot de passe sécurisé</p>
    </div>

    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-8 shadow-xl"
         x-data="resetForm('{{ token }}')">

      <div x-show="msg" x-cloak
           :class="ok ? 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 text-emerald-600' :
                        'bg-red-50 dark:bg-red-900/20 border-red-200 text-red-600'"
           class="flex items-center gap-2 border rounded-lg px-4 py-3 mb-4 text-sm">
        <i :data-lucide="ok ? 'check-circle' : 'alert-circle'" class="w-4 h-4 flex-shrink-0"></i>
        <span x-text="msg"></span>
      </div>

      <form @submit.prevent="submit" class="space-y-4" x-show="!done">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Nouveau mot de passe</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
            <input type="password" x-model="password" placeholder="••••••••" required
                   class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600
                          rounded-lg pl-10 pr-4 py-2.5 text-gray-900 dark:text-white
                          placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent text-sm"/>
          </div>
          <p class="text-xs text-gray-400 mt-1">Min. 8 caractères, 1 majuscule, 1 chiffre</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Confirmer le mot de passe</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
            <input type="password" x-model="confirm" placeholder="••••••••" required
                   class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600
                          rounded-lg pl-10 pr-4 py-2.5 text-gray-900 dark:text-white
                          placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent text-sm"/>
          </div>
        </div>

        <button type="submit" :disabled="loading"
                class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500
                       text-white font-semibold py-2.5 rounded-lg transition-all duration-200 text-sm
                       disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-cyan-500/20">
          <span x-show="!loading">Réinitialiser</span>
          <span x-show="loading" x-cloak class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Traitement...
          </span>
        </button>
      </form>

      <div x-show="done" x-cloak class="text-center py-4">
        <a href="/login"
           class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600
                  text-white font-semibold rounded-lg transition-all text-sm shadow-md">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Se connecter
        </a>
      </div>

      <div class="text-center mt-4">
        <a href="/login" class="text-sm text-cyan-500 hover:text-cyan-400 transition-colors">← Retour à la connexion</a>
      </div>
    </div>
  </div>
</div>

<script>
function resetForm(token) {
  return {
    token, password: '', confirm: '', loading: false, msg: '', ok: false, done: false,
    async submit() {
      if (this.password !== this.confirm) {
        this.ok = false; this.msg = 'Les mots de passe ne correspondent pas'; return;
      }
      this.loading = true; this.msg = '';
      try {
        const res = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: this.token, new_password: this.password }),
        });
        const d = await res.json();
        this.ok = res.ok;
        this.msg = d.message || d.detail;
        if (res.ok) { this.done = true; }
      } catch(e) { this.ok = false; this.msg = 'Erreur réseau'; }
      finally { this.loading = false; this.$nextTick(() => lucide.createIcons()); }
    }
  };
}
</script>
{% endblock %}
