version: "3.9"

# ============================================================
#  AQIMS — Air Quality Index Monitoring System
#  Docker Compose — Phase 1 : Infrastructure complète
# ============================================================

services:

  # ----------------------------------------------------------
  #  EMQX — Broker MQTT sécurisé (TLS 1.3 + Auth + QoS=2)
  # ----------------------------------------------------------
  emqx:
    image: emqx/emqx:5.4.1
    container_name: aqims_emqx
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT (dev seulement — désactiver en prod)
      - "8883:8883"    # MQTT + TLS
      - "18083:18083"  # Dashboard EMQX (admin web)
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./certs:/opt/emqx/etc/certs:ro
      - emqx_data:/opt/emqx/data
      - emqx_logs:/opt/emqx/log
    environment:
      - EMQX_NAME=aqims_broker
      - EMQX_HOST=127.0.0.1
    networks:
      - aqims_net
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  #  PostgreSQL — Base de données relationnelle (users, devices)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aqims_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aqims_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  #  InfluxDB — Base de données time-series (données capteurs)
  # ----------------------------------------------------------
  influxdb:
    image: influxdb:2.7-alpine
    container_name: aqims_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - aqims_net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  #  Redis — Cache + Pub/Sub temps réel + Rate limiting
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aqims_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - aqims_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  #  Backend FastAPI — API REST + WebSocket + MQTT subscriber
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aqims_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Surcharge les valeurs "localhost" du .env par les noms de services Docker
      - INFLUX_HOST=http://influxdb:8086
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - MQTT_HOST=emqx
      - MQTT_CA_CERT=/app/certs/ca.crt
      - MQTT_CLIENT_CERT=/app/certs/client.crt
      - MQTT_CLIENT_KEY=/app/certs/client.key
    volumes:
      - ./certs:/app/certs:ro
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - aqims_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  #  Nginx — Reverse proxy + HTTPS + Rate limiting
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: aqims_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - aqims_net

# ----------------------------------------------------------
#  Volumes persistants
# ----------------------------------------------------------
volumes:
  emqx_data:
  emqx_logs:
  postgres_data:
  influxdb_data:
  redis_data:

# ----------------------------------------------------------
#  Réseau interne isolé
# ----------------------------------------------------------
networks:
  aqims_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
