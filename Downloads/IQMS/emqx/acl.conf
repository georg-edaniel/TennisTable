## ============================================================
##  EMQX — Règles d'autorisation MQTT (ACL)
##  Format : {allow|deny, user|ipaddr|all, pub|sub|all, [topics]}
## ============================================================

## Le service backend peut tout publier et souscrire
{allow, {user, "backend_service"}, all, ["#"]}.

## Les capteurs ESP32 peuvent publier sur leur topic et souscrire aux OTA
{allow, {user, "esp32_device"}, publish,   ["aqims/sensors/#", "aqims/status/#"]}.
{allow, {user, "esp32_device"}, subscribe, ["aqims/ota/#", "aqims/config/#"]}.

## Les clients dashboard ne peuvent que souscrire
{allow, {user, "dashboard_client"}, subscribe, ["aqims/sensors/#", "aqims/alerts/#"]}.

## Bloquer tout le reste
{deny, all, all, ["#"]}.
