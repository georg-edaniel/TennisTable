## ============================================================
##  EMQX 5.x — Configuration sécurisée AQIMS
## ============================================================

node {
  name = "aqims_broker@127.0.0.1"
  cookie = "aqims_secret_cookie"
  data_dir = "/opt/emqx/data"
}

## --- Listener MQTT non-chiffré (dev uniquement) ---
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 100
}

## --- Listener MQTT + TLS 1.3 (production) ---
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 1000

  ssl_options {
    versions = ["tlsv1.3", "tlsv1.2"]
    keyfile   = "/opt/emqx/etc/certs/server.key"
    certfile  = "/opt/emqx/etc/certs/server.crt"
    cacertfile = "/opt/emqx/etc/certs/ca.crt"

    ## Authentification mutuelle : le client doit présenter son certificat
    verify = verify_peer
    fail_if_no_peer_cert = true
  }
}

## --- Authentification : username + password (bcrypt) ---
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    password_hash_algorithm {
      name = bcrypt
      salt_rounds = 10
    }
  }
]

## --- Autorisation (ACL) ---
authorization {
  no_match = deny
  deny_action = disconnect

  sources = [
    {
      type = file
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

## --- Limites de sécurité ---
mqtt {
  max_packet_size = 1MB
  max_clientid_len = 64
  max_topic_levels = 10
  max_qos_allowed = 2
  retain_available = true
  session_expiry_interval = 2h
}

## --- Dashboard EMQX ---
dashboard {
  listeners.http {
    bind = 18083
  }
  default_username = "admin"
  default_password = "aqims_admin_2024!"
}

## --- Logging ---
log {
  file {
    level = warning
    path = "/opt/emqx/log/emqx.log"
  }
  console {
    level = info
  }
}
