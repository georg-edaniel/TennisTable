{% extends "base.html" %}
{% block title %}Changer le mot de passe — TT Tracker{% endblock %}

{% block content %}
<div class="page-header animate-in">
  <h1 class="page-title">Mot de passe</h1>
  <p class="page-subtitle">Modifiez votre mot de passe de connexion</p>
</div>

<div class="card animate-in" style="max-width:480px" x-data="{
  oldPassword: '',
  newPassword: '',
  confirmPassword: '',
  loading: false,
  error: '',
  success: false,

  async submit() {
    this.error = '';
    if (!this.newPassword) { this.error = 'Entrez un nouveau mot de passe.'; return; }
    if (this.newPassword !== this.confirmPassword) { this.error = 'Les mots de passe ne correspondent pas.'; return; }
    this.loading = true;
    try {
      const r = await fetch('/auth/change-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({old_password: this.oldPassword, new_password: this.newPassword})
      });
      if (!r.ok) { const e = await r.json(); this.error = e.detail || 'Erreur'; return; }
      this.success = true;
      $store.tennis.notify('Mot de passe modifié avec succès', 'success');
      setTimeout(() => location.href = '/dashboard', 1500);
    } catch(e) { this.error = 'Erreur réseau'; }
    finally { this.loading = false; }
  }
}">
  <div x-show="success" style="color:var(--accent-green);font-size:0.9rem;margin-bottom:1rem;padding:0.6rem 0.75rem;background:rgba(16,185,129,0.08);border-radius:6px;border:1px solid rgba(16,185,129,0.2)">
    Mot de passe modifié ! Redirection en cours…
  </div>
  <div x-show="error" x-text="error" style="color:var(--accent-red);font-size:0.875rem;margin-bottom:1rem;padding:0.6rem 0.75rem;background:rgba(244,63,94,0.08);border-radius:6px;border:1px solid rgba(244,63,94,0.2)"></div>

  <div style="margin-bottom:0.75rem">
    <label class="label">Ancien mot de passe</label>
    <input class="input" type="password" x-model="oldPassword" placeholder="••••••••">
  </div>
  <div style="margin-bottom:0.75rem">
    <label class="label">Nouveau mot de passe</label>
    <input class="input" type="password" x-model="newPassword" placeholder="••••••••">
  </div>
  <div style="margin-bottom:1.25rem">
    <label class="label">Confirmer le nouveau mot de passe</label>
    <input class="input" type="password" x-model="confirmPassword" placeholder="••••••••" @keyup.enter="submit">
  </div>

  <button class="btn btn-primary" style="width:100%;justify-content:center" @click="submit" :disabled="loading">
    <i data-lucide="key" style="width:16px;height:16px"></i>
    <span x-text="loading ? 'Enregistrement...' : 'Modifier le mot de passe'"></span>
  </button>
</div>
{% endblock %}

{% block scripts %}
<script>document.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons()});</script>
{% endblock %}
