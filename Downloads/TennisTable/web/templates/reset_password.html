<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — TT Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v=3">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="login-bg" x-data="{
  password: '',
  confirm: '',
  error: '',
  success: false,
  loading: false,
  token: '{{ token }}',
  async submit() {
    this.error = '';
    if (this.password.length < 6) { this.error = 'Minimum 6 caractères'; return; }
    if (this.password !== this.confirm) { this.error = 'Les mots de passe ne correspondent pas'; return; }
    this.loading = true;
    try {
      const r = await fetch('/auth/reset-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token: this.token, new_password: this.password})
      });
      if (!r.ok) { const e = await r.json(); this.error = e.detail || 'Erreur'; return; }
      this.success = true;
    } catch(e) { this.error = 'Connexion impossible'; }
    finally { this.loading = false; }
  }
}">
  <div class="login-card animate-in">
    <div style="text-align:center;margin-bottom:1.75rem">
      <div style="font-size:2.5rem">🔑</div>
      <h1 style="font-size:1.4rem;font-weight:900;letter-spacing:-0.03em;margin-top:0.5rem">Nouveau mot de passe</h1>
      <p style="color:var(--text-muted);font-size:0.875rem;margin-top:0.25rem">Choisissez un mot de passe sécurisé</p>
    </div>

    <div x-show="!success">
      <div style="margin-bottom:0.75rem">
        <label class="label">Nouveau mot de passe</label>
        <input class="input" type="password" x-model="password" placeholder="••••••••">
      </div>
      <div style="margin-bottom:1.25rem">
        <label class="label">Confirmer</label>
        <input class="input" type="password" x-model="confirm" placeholder="••••••••" @keyup.enter="submit">
      </div>
      <div x-show="error" x-text="error" style="color:var(--accent-red);font-size:0.85rem;margin-bottom:0.75rem"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" @click="submit" :disabled="loading">
        <span x-text="loading ? 'Enregistrement...' : 'Changer le mot de passe'"></span>
      </button>
    </div>

    <div x-show="success" style="text-align:center;padding:1rem 0">
      <div style="font-size:2rem;margin-bottom:0.75rem">✅</div>
      <p style="color:var(--text-primary);font-weight:600">Mot de passe modifié !</p>
      <a href="/login" class="btn btn-primary" style="display:inline-flex;margin-top:1rem;justify-content:center">
        Se connecter
      </a>
    </div>

    <div x-show="!success" style="margin-top:1.25rem;text-align:center">
      <a href="/login" style="color:var(--text-muted);font-size:0.85rem;text-decoration:underline">
        ← Retour à la connexion
      </a>
    </div>
  </div>
</div>
</body>
</html>
